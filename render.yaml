# Render Blueprint: Next.js app (free tier).
# Set all env vars in Render Dashboard → Service → Environment.
# See DEPLOY.md for the full list.

services:
  - type: web
    name: sparkeefy-waitlist
    runtime: node
    plan: free

    buildCommand: bun install --frozen-lockfile && bun run build
    startCommand: bun run start
    preDeployCommand: bun run db:migrate

    # Env vars (add in Dashboard): DATABASE_URL, SMTP_*, etc.
    # No CORS or FRONTEND_URL needed - single Next.js service handles everything.

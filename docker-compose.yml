services:
  postgres:
    image: postgres:17-alpine
    container_name: sparkeefy_postgres
    restart: always
    environment:
      POSTGRES_USER: sparkeefy
      POSTGRES_PASSWORD: sparkeefy123
      POSTGRES_DB: sparkeefy_waitlist
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

# Development PostgreSQL for local development
# Next.js server runs on port 3000 with server actions

# Start database:
# docker-compose up -d

# Check status:
# docker-compose ps

# View logs:
# docker-compose logs -f postgres

# Run Next.js dev server:
# pnpm dev
